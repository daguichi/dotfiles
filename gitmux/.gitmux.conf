tmux:
  symbols:
    branch: " "
    hashprefix: ":"
    ahead: "↑"
    behind: "↓"
    staged: "+"
    conflict: "!"
    modified: "~"
    untracked: "?"
    stashed: "*"
    clean: "✓"
  styles:
    clear: "#[fg=default]"
    state: "#[fg=red,bold]"
    branch: "#[fg=#cba6f7,bold]"
    remote: "#[fg=#89b4fa]"
    staged: "#[fg=#a6e3a1]"
    conflict: "#[fg=#f38ba8,bold]"
    modified: "#[fg=#fab387]"
    untracked: "#[fg=#9399b2]"
    stashed: "#[fg=#94e2d5]"
    clean: "#[fg=#a6e3a1]"
  layout: [branch, " ", flags]
  options:
    branch_max_len: 30
    hide_clean: false
