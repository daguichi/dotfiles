# ── General ──────────────────────────────────────────
set -g mouse on
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set -g status-interval 5

# ── Extended keys (Ctrl+Shift+Arrow support) ────────
set -g extended-keys on

# ── Pane dimming (inactive panes appear dimmed) ─────
set -g window-style 'fg=#a6adc8,bg=#1e1e2e'
set -g window-active-style 'fg=default,bg=#181825'

# ── Pane borders with labels ────────────────────────
set -g pane-border-style "fg=colour238 bg=default"
set -g pane-active-border-style "fg=blue bg=default"
set -g pane-border-format ' #[bold]#P #[default]#{?pane_title,#{pane_title},#{pane_current_command}} '
set -g pane-border-status top

# ── Fast pane navigation (no prefix needed) ─────────
bind -n C-S-Left select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up select-pane -U
bind -n C-S-Down select-pane -D

# ── Clipboard & passthrough ─────────────────────────
set -g set-clipboard on
set -g allow-passthrough all

# ── Copy mouse selection to system clipboard (macOS) ─
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Terminal overrides for clipboard/cursor ─────────
set -ga terminal-overrides ',xterm-256color:Ms=\E]52;c;%p2%s\007'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -ga update-environment "TERM_PROGRAM"

# ── Catppuccin ───────────────────────────────────────
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# Window format
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# Status line
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_gitmux}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

# Date/time format
set -g @catppuccin_date_time_text " %b %d  %H:%M"

# Gitmux
set -g @catppuccin_gitmux_text "#(gitmux -cfg ~/.gitmux.conf \"#{pane_current_path}\")"

# ── TPM (keep at the bottom) ────────────────────────
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'
