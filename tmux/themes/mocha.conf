# Catppuccin Mocha (dark)
set -g @catppuccin_flavor 'mocha'

# Pane dimming (inactive panes appear dimmed)
set -g window-style 'fg=#a6adc8,bg=#181825'
set -g window-active-style 'fg=#cdd6f4,bg=#1e1e2e'

# Pane borders
set -g pane-border-style 'fg=#45475a,bg=#181825'
set -g pane-active-border-style 'fg=#89b4fa,bg=#1e1e2e'
set -g pane-border-format ' #[fg=#b4befe,bold]#P #[fg=#a6adc8]#{?pane_title,#{pane_title},#{pane_current_command}} '

# Messages & copy mode
set -g message-style 'fg=#cdd6f4,bg=#313244'
set -g message-command-style 'fg=#cdd6f4,bg=#313244'
set -g mode-style 'fg=#89b4fa,bg=#313244,bold'
