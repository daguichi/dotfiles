# Catppuccin Latte (light)
set -g @catppuccin_flavor 'latte'

# Pane dimming (inactive panes appear dimmed)
set -g window-style 'fg=#6c6f85,bg=#e6e9ef'
set -g window-active-style 'fg=#4c4f69,bg=#eff1f5'

# Pane borders
set -g pane-border-style 'fg=#bcc0cc,bg=#e6e9ef'
set -g pane-active-border-style 'fg=#1e66f5,bg=#eff1f5'
set -g pane-border-format ' #[fg=#7287fd,bold]#P #[fg=#6c6f85]#{?pane_title,#{pane_title},#{pane_current_command}} '

# Messages & copy mode
set -g message-style 'fg=#4c4f69,bg=#ccd0da'
set -g message-command-style 'fg=#4c4f69,bg=#ccd0da'
set -g mode-style 'fg=#1e66f5,bg=#ccd0da,bold'
